<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="manifest" href="manifest.json">
  <title>GeoTIFF Overlay & Fast Render</title>
  <!-- Library GeoTIFF untuk membaca file raster di browser -->
  <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 12px; background: #1e1e1e; color: #e0e0e0;
    }
    .panel {
      background: #2a2a2a; padding: 14px; border-radius: 8px; margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    label { font-weight: bold; font-size: 13px; display: block; margin-top: 8px; color: #4caf50; }
    input[type="file"], input[type="number"] {
      width: 100%; padding: 8px; margin: 4px 0 10px 0; box-sizing: border-box;
      background: #3a3a3a; color: white; border: 1px solid #555; border-radius: 4px;
    }
    .btn-group { display: flex; gap: 8px; margin-top: 6px; }
    button {
      flex: 1; padding: 10px; font-weight: bold; border: none; border-radius: 4px;
      cursor: pointer; font-size: 13px;
    }
    .btn-draw { background: #ff9800; color: #1e1e1e; }
    .btn-reset { background: #555; color: white; }
    .btn-export { background: #2e7d32; color: white; font-size: 15px; margin-top: 10px; width: 100%; }
    #canvasContainer {
      position: relative; width: 100%; height: 380px; background: #111;
      border: 1px solid #444; border-radius: 6px; overflow: hidden; touch-action: none;
    }
    canvas { width: 100%; height: 100%; display: block; }
    #infoBox {
      font-size: 12px; margin-top: 6px; color: #aaa; line-height: 1.4;
      background: #181818; padding: 8px; border-radius: 4px;
    }
    #status { font-weight: bold; color: #64b5f6; margin-top: 8px; font-size: 13px; }
  </style>
</head>
<body>

<div class="panel">
  <h3 style="margin: 0 0 10px 0; color: #fff;">Fast GeoTIFF (UTM 50N)</h3>
  
  <label>1. Input Citra Ortho (.tif):</label>
  <input type="file" id="orthoInput" accept=".tif,.tiff">

  <label>2. Input Desain CAD (.dxf):</label>
  <input type="file" id="dxfInput" accept=".dxf">

  <div style="display: flex; gap: 10px;">
    <div style="flex: 1;">
      <label>Sample Spacing (m/px):</label>
      <input type="number" id="spacing" value="2.0" step="0.5">
    </div>
    <div style="flex: 1;">
      <label>Buffer Auto (meter):</label>
      <input type="number" id="bufferVal" value="100.0">
    </div>
  </div>

  <div class="btn-group">
    <button class="btn-draw" id="btnToggleDraw" onclick="toggleDrawMode()">✏️ Gambar Kotak Manual</button>
    <button class="btn-reset" onclick="fitBoxToDxf()">🎯 Kotak Otomatis DXF</button>
  </div>
</div>

<div id="canvasContainer">
  <canvas id="mapCanvas"></canvas>
</div>

<div id="infoBox">
  Dimensi Kotak: <span id="boxDim">-</span><br>
  Estimasi Ukuran: <span id="estSize">-</span>
</div>

<button class="btn-export" onclick="exportGeoTiff()">EKSPOR GEOTIFF KE AVENZA</button>
<div id="status">Silakan pilih file Ortho dan DXF.</div>

<script>
  let orthoCanvas = null;
  let orthoBounds = null; // { minX, minY, maxX, maxY }
  let dxfLines = [];
  let dxfBounds = null;   // { minX, minY, maxX, maxY }
  let exportBox = null;   // { minX, minY, maxX, maxY }
  
  let worldBounds = null; // Area cakupan tampilan layar
  let isDrawMode = false;
  let isDragging = false;
  let dragStart = null;

  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');
  const statusDiv = document.getElementById('status');

  function resizeCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    redrawMap();
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // 1. INPUT ORTHOPHOTO
  document.getElementById('orthoInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    statusDiv.innerText = "Membaca Ortho TIFF...";

    try {
      const tiff = await GeoTIFF.fromBlob(file);
      const image = await tiff.getImage();
      
      const bbox = image.getBoundingBox(); // [minX, minY, maxX, maxY]
      orthoBounds = { minX: bbox[0], minY: bbox[1], maxX: bbox[2], maxY: bbox[3] };

      // Buat preview thumbnail ortho di memori (maks resolusi preview 1500px agar HP tidak berat)
      let w = image.getWidth();
      let h = image.getHeight();
      const maxDim = 1500;
      if (w > maxDim || h > maxDim) {
        const ratio = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }

      statusDiv.innerText = "Membuat visual ortho...";
      const rgb = await image.readRGB({ width: w, height: h });

      orthoCanvas = document.createElement('canvas');
      orthoCanvas.width = w;
      orthoCanvas.height = h;
      const oCtx = orthoCanvas.getContext('2d');
      const imgData = oCtx.createImageData(w, h);

      let src = 0, dst = 0;
      for (let i = 0; i < w * h; i++) {
        imgData.data[dst] = rgb[src];
        imgData.data[dst+1] = rgb[src+1];
        imgData.data[dst+2] = rgb[src+2];
        imgData.data[dst+3] = 255;
        src += 3; dst += 4;
      }
      oCtx.putImageData(imgData, 0, 0);

      updateWorldBounds();
      statusDiv.innerText = "Ortho berhasil dimuat!";
      redrawMap();
    } catch (err) {
      statusDiv.innerText = "Gagal membaca Ortho: " + err.message;
    }
  });

  // 2. INPUT DXF
  document.getElementById('dxfInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    statusDiv.innerText = "Membaca garis DXF...";

    const text = await file.text();
    const lines = text.split(/\r?\n/);
    dxfLines = [];
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

    let entity = "", x1 = 0, y1 = 0, x2 = 0, y2 = 0;
    let lastX = 0, lastY = 0, isFirst = true;

    for (let i = 0; i < lines.length - 1; i += 2) {
      let code = lines[i].trim();
      let val = lines[i+1].trim();

      if (code === "0") {
        if (entity === "LINE") {
          dxfLines.push({ x1, y1, x2, y2 });
          minX = Math.min(minX, x1, x2); maxX = Math.max(maxX, x1, x2);
          minY = Math.min(minY, y1, y2); maxY = Math.max(maxY, y1, y2);
        }
        entity = val;
        isFirst = true;
      } else if (entity === "LINE") {
        if (code === "10") x1 = parseFloat(val);
        if (code === "20") y1 = parseFloat(val);
        if (code === "11") x2 = parseFloat(val);
        if (code === "21") y2 = parseFloat(val);
      } else if (entity === "LWPOLYLINE") {
        if (code === "10") {
          let curX = parseFloat(val);
          let nextCode = lines[i+2]?.trim();
          let nextVal = lines[i+3]?.trim();
          if (nextCode === "20") {
            let curY = parseFloat(nextVal);
            if (!isFirst) {
              dxfLines.push({ x1: lastX, y1: lastY, x2: curX, y2: curY });
              minX = Math.min(minX, lastX, curX); maxX = Math.max(maxX, lastX, curX);
              minY = Math.min(minY, lastY, curY); maxY = Math.max(maxY, lastY, curY);
            }
            lastX = curX; lastY = curY; isFirst = false;
          }
        }
      }
    }

    if (dxfLines.length > 0) {
      dxfBounds = { minX, minY, maxX, maxY };
      fitBoxToDxf();
      updateWorldBounds();
      statusDiv.innerText = `DXF dimuat (${dxfLines.length} garis).`;
    } else {
      statusDiv.innerText = "Tidak ditemukan entitas garis (LINE/LWPOLYLINE) di DXF.";
    }
    redrawMap();
  });

  function updateWorldBounds() {
    let b = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    if (orthoBounds) {
      b.minX = Math.min(b.minX, orthoBounds.minX);
      b.minY = Math.min(b.minY, orthoBounds.minY);
      b.maxX = Math.max(b.maxX, orthoBounds.maxX);
      b.maxY = Math.max(b.maxY, orthoBounds.maxY);
    }
    if (dxfBounds) {
      b.minX = Math.min(b.minX, dxfBounds.minX);
      b.minY = Math.min(b.minY, dxfBounds.minY);
      b.maxX = Math.max(b.maxX, dxfBounds.maxX);
      b.maxY = Math.max(b.maxY, dxfBounds.maxY);
    }
    if (b.minX !== Infinity) {
      const marginX = (b.maxX - b.minX) * 0.05;
      const marginY = (b.maxY - b.minY) * 0.05;
      worldBounds = {
        minX: b.minX - marginX,
        minY: b.minY - marginY,
        maxX: b.maxX + marginX,
        maxY: b.maxY + marginY
      };
    }
  }

  function fitBoxToDxf() {
    if (!dxfBounds) return;
    const buf = parseFloat(document.getElementById('bufferVal').value) || 100.0;
    exportBox = {
      minX: dxfBounds.minX - buf,
      minY: dxfBounds.minY - buf,
      maxX: dxfBounds.maxX + buf,
      maxY: dxfBounds.maxY + buf
    };
    updateInfoBox();
    redrawMap();
  }

  function toggleDrawMode() {
    isDrawMode = !isDrawMode;
    const btn = document.getElementById('btnToggleDraw');
    if (isDrawMode) {
      btn.style.background = "#d32f2f";
      btn.style.color = "white";
      btn.innerText = "❌ Selesai Gambar";
      statusDiv.innerText = "Mode Gambar Aktif: Usap jari di peta untuk membuat kotak boundary.";
    } else {
      btn.style.background = "#ff9800";
      btn.style.color = "#1e1e1e";
      btn.innerText = "✏️ Gambar Kotak Manual";
      statusDiv.innerText = "Mode normal.";
    }
  }

  // TRANSFORMASI KOORDINAT
  function worldToScreen(x, y) {
    if (!worldBounds) return { x: 0, y: 0 };
    const scale = Math.min(
      canvas.width / (worldBounds.maxX - worldBounds.minX),
      canvas.height / (worldBounds.maxY - worldBounds.minY)
    );
    return {
      x: (x - worldBounds.minX) * scale,
      y: (worldBounds.maxY - y) * scale,
      scale
    };
  }

  function screenToWorld(px, py) {
    if (!worldBounds) return { x: 0, y: 0 };
    const scale = Math.min(
      canvas.width / (worldBounds.maxX - worldBounds.minX),
      canvas.height / (worldBounds.maxY - worldBounds.minY)
    );
    return {
      x: worldBounds.minX + (px / scale),
      y: worldBounds.maxY - (py / scale)
    };
  }

  // EVENT SENTUHAN / MOUSE UNTUK MENGGAMBAR KOTAK
  canvas.addEventListener('pointerdown', (e) => {
    if (!isDrawMode || !worldBounds) return;
    isDragging = true;
    canvas.setPointerCapture(e.pointerId);
    const rect = canvas.getBoundingClientRect();
    dragStart = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    exportBox = { minX: dragStart.x, minY: dragStart.y, maxX: dragStart.x, maxY: dragStart.y };
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDragging || !dragStart) return;
    const rect = canvas.getBoundingClientRect();
    const cur = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    exportBox = {
      minX: Math.min(dragStart.x, cur.x),
      maxX: Math.max(dragStart.x, cur.x),
      minY: Math.min(dragStart.y, cur.y),
      maxY: Math.max(dragStart.y, cur.y)
    };
    updateInfoBox();
    redrawMap();
  });

  canvas.addEventListener('pointerup', () => {
    isDragging = false;
    dragStart = null;
  });

  function updateInfoBox() {
    if (!exportBox) return;
    const wMeter = Math.round(exportBox.maxX - exportBox.minX);
    const hMeter = Math.round(exportBox.maxY - exportBox.minY);
    const sp = parseFloat(document.getElementById('spacing').value) || 2.0;
    const pxW = Math.round(wMeter / sp);
    const pxH = Math.round(hMeter / sp);
    const estKb = Math.round((pxW * pxH * 3) / 1024);

    document.getElementById('boxDim').innerText = `${wMeter} m x ${hMeter} m (${pxW} x ${pxH} px)`;
    document.getElementById('estSize').innerText = `~${(estKb / 1024).toFixed(1)} MB (pada ${sp} m/px)`;
  }

  // GAMBAR PETA, OVERLAY, DAN KOTAK
  function redrawMap() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!worldBounds) {
      ctx.fillStyle = "#666";
      ctx.font = "14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Peta belum dimuat", canvas.width / 2, canvas.height / 2);
      return;
    }

    // 1. Gambar Citra Ortho
    if (orthoCanvas && orthoBounds) {
      const p1 = worldToScreen(orthoBounds.minX, orthoBounds.maxY);
      const p2 = worldToScreen(orthoBounds.maxX, orthoBounds.minY);
      ctx.drawImage(orthoCanvas, p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
    }

    // 2. Gambar Garis DXF (Overlay warna kuning terang)
    if (dxfLines.length > 0) {
      ctx.strokeStyle = "#FFFF00";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let l of dxfLines) {
        const s1 = worldToScreen(l.x1, l.y1);
        const s2 = worldToScreen(l.x2, l.y2);
        ctx.moveTo(s1.x, s1.y);
        ctx.lineTo(s2.x, s2.y);
      }
      ctx.stroke();
    }

    // 3. Gambar Kotakan Export Boundary (Merah transparan)
    if (exportBox) {
      const b1 = worldToScreen(exportBox.minX, exportBox.maxY);
      const b2 = worldToScreen(exportBox.maxX, exportBox.minY);
      const boxW = b2.x - b1.x;
      const boxH = b2.y - b1.y;

      ctx.fillStyle = "rgba(255, 0, 0, 0.25)";
      ctx.fillRect(b1.x, b1.y, boxW, boxH);

      ctx.strokeStyle = "#FF3D00";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 4]);
      ctx.strokeRect(b1.x, b1.y, boxW, boxH);
      ctx.setLineDash([]);
    }
  }

  // 3. EKSPOR KE GEOTIFF (EPSG:32650)
  async function exportGeoTiff() {
    if (!exportBox) {
      alert("Kotakan boundary belum ditentukan!");
      return;
    }
    const spacing = parseFloat(document.getElementById('spacing').value) || 2.0;
    const widthPx = Math.ceil((exportBox.maxX - exportBox.minX) / spacing);
    const heightPx = Math.ceil((exportBox.maxY - exportBox.minY) / spacing);

    if (widthPx <= 0 || heightPx <= 0) {
      alert("Ukuran kotakan tidak valid!");
      return;
    }

    statusDiv.innerText = `Me-render resolusi ${widthPx} x ${heightPx} px...`;

    // Buat kanvas ekspor
    const expCanvas = document.createElement('canvas');
    expCanvas.width = widthPx;
    expCanvas.height = heightPx;
    const expCtx = expCanvas.getContext('2d');

    // Latar belakang gelap jika citra ortho tidak mencakup seluruh area
    expCtx.fillStyle = "#222";
    expCtx.fillRect(0, 0, widthPx, heightPx);

    // Plot Ortho sesuai potongan kotak
    if (orthoCanvas && orthoBounds) {
      const srcScaleX = orthoCanvas.width / (orthoBounds.maxX - orthoBounds.minX);
      const srcScaleY = orthoCanvas.height / (orthoBounds.maxY - orthoBounds.minY);

      const sx = (exportBox.minX - orthoBounds.minX) * srcScaleX;
      const sy = (orthoBounds.maxY - exportBox.maxY) * srcScaleY;
      const sw = (exportBox.maxX - exportBox.minX) * srcScaleX;
      const sh = (exportBox.maxY - exportBox.minY) * srcScaleY;

      expCtx.drawImage(orthoCanvas, sx, sy, sw, sh, 0, 0, widthPx, heightPx);
    }

    // Plot Garis DXF di atas kanvas ekspor
    if (dxfLines.length > 0) {
      expCtx.strokeStyle = "#FFFF00";
      expCtx.lineWidth = 3; // Tebal garis agar jelas di layar HP pengawas
      expCtx.beginPath();
      for (let l of dxfLines) {
        let px1 = (l.x1 - exportBox.minX) / spacing;
        let py1 = (exportBox.maxY - l.y1) / spacing;
        let px2 = (l.x2 - exportBox.minX) / spacing;
        let py2 = (exportBox.maxY - l.y2) / spacing;
        expCtx.moveTo(px1, py1);
        expCtx.lineTo(px2, py2);
      }
      expCtx.stroke();
    }

    statusDiv.innerText = "Mengemas GeoTIFF uncompressed (EPSG:32650)...";

    // Ekstrak Raw RGB
    const imgData = expCtx.getImageData(0, 0, widthPx, heightPx).data;
    const rawRgb = new Uint8Array(widthPx * heightPx * 3);
    let s = 0, d = 0;
    for (let i = 0; i < widthPx * heightPx; i++) {
      rawRgb[d] = imgData[s];
      rawRgb[d+1] = imgData[s+1];
      rawRgb[d+2] = imgData[s+2];
      s += 4; d += 3;
    }

    const tiffBlob = createRawGeoTiff(rawRgb, widthPx, heightPx, exportBox.minX, exportBox.maxY, spacing);
    const url = URL.createObjectURL(tiffBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `PETA_AVENZA_${Date.now()}.tif`;
    a.click();

    statusDiv.innerText = `Berhasil! File TIFF siap diunduh (${(tiffBlob.size / 1024 / 1024).toFixed(2)} MB).`;
  }

  // PEMBUAT STRUKTUR BINARY GEOTIFF STANDAR (KOMPATIBEL 100% DENGAN AVENZA)
  function createRawGeoTiff(rgbBytes, width, height, minX, maxY, spacing) {
    const numEntries = 13;
    const ifdOffset = 8;
    const ifdSize = 2 + (numEntries * 12) + 4;
    const pixelDataOffset = ifdOffset + ifdSize;
    const extraOffset = pixelDataOffset + rgbBytes.length;
    const totalSize = extraOffset + 6 + 24 + 48 + 16;

    const buffer = new ArrayBuffer(totalSize);
    const view = new DataView(buffer);

    // Header TIFF (Little Endian: II)
    view.setUint16(0, 0x4949, true);
    view.setUint16(2, 42, true);
    view.setUint32(4, ifdOffset, true);

    let p = ifdOffset;
    view.setUint16(p, numEntries, true); p += 2;

    function addTag(tag, type, count, val) {
      view.setUint16(p, tag, true);
      view.setUint16(p+2, type, true);
      view.setUint32(p+4, count, true);
      view.setUint32(p+8, val, true);
      p += 12;
    }

    // Urutan tag wajib berurutan numerik (Ascending)
    addTag(256, 4, 1, width);                          // ImageWidth
    addTag(257, 4, 1, height);                         // ImageLength
    addTag(258, 3, 3, extraOffset);                    // BitsPerSample [8,8,8]
    addTag(259, 3, 1, 1);                              // Compression: 1 (Uncompressed)
    addTag(262, 3, 1, 2);                              // Photometric: 2 (RGB)
    addTag(273, 4, 1, pixelDataOffset);                // StripOffsets
    addTag(277, 3, 1, 3);                              // SamplesPerPixel: 3
    addTag(278, 4, 1, height);                         // RowsPerStrip
    addTag(279, 4, 1, rgbBytes.length);                // StripByteCounts
    addTag(284, 3, 1, 1);                              // PlanarConfiguration: Chunky
    addTag(33550, 12, 3, extraOffset + 6);             // ModelPixelScaleTag
    addTag(33922, 12, 6, extraOffset + 30);            // ModelTiepointTag
    addTag(34735, 3, 8, extraOffset + 78);             // GeoKeyDirectoryTag

    view.setUint32(p, 0, true); // End of IFD

    // Salin data piksel
    new Uint8Array(buffer, pixelDataOffset, rgbBytes.length).set(rgbBytes);

    // Tulis Metadata Tambahan
    let extra = new DataView(buffer, extraOffset);
    // BitsPerSample
    extra.setUint16(0, 8, true); extra.setUint16(2, 8, true); extra.setUint16(4, 8, true);
    // PixelScale (spacing, spacing, 0)
    extra.setFloat64(6, spacing, true); extra.setFloat64(14, spacing, true); extra.setFloat64(22, 0.0, true);
    // Tiepoint (0, 0, 0, minX, maxY, 0)
    extra.setFloat64(30, 0.0, true); extra.setFloat64(38, 0.0, true); extra.setFloat64(46, 0.0, true);
    extra.setFloat64(54, minX, true); extra.setFloat64(62, maxY, true); extra.setFloat64(70, 0.0, true);
    // GeoKey UTM 50N (EPSG:32650)
    extra.setUint16(78, 1, true); extra.setUint16(80, 1, true); extra.setUint16(82, 0, true); extra.setUint16(84, 1, true);
    extra.setUint16(86, 3072, true); extra.setUint16(88, 0, true); extra.setUint16(90, 1, true); extra.setUint16(92, 32650, true);

    return new Blob([buffer], { type: 'image/tiff' });
  }
</script>
</body>
</html>
